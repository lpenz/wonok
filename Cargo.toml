[package]
name = "wonok"
description = "Atomically write the output of a command to a file depending on its exit value"
version = "0.1.1"
edition = "2024"
authors = ["Leandro Lisboa Penz <lpenz@lpenz.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/lpenz/wonok"
repository = "https://github.com/lpenz/wonok"
build = "build.rs"
categories = ["command-line-utilities"]
keywords = ["command-line"]

[dependencies]
atomic-write-file = "0.3.0"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.3"
clap2man = "0.1.1"
color-eyre = "0.6.5"
man = "0.3.0"

[package.metadata.deb]
section = "utils"
extended-description = """\
Atomically write the output of a command to a file depending on its exit value
"""
assets = [
    ["target/release/wonok.1", "usr/share/man/man1/", "644"],
    ["target/release/wonok", "usr/bin/", "755"],
    ["LICENSE", "usr/share/doc/wonok/", "644"],
    ["AUTHORS", "usr/share/doc/wonok/", "644"],
    ["README.md", "usr/share/doc/wonok/", "644"],
    ["target/release/wonok.bash", "/usr/share/bash-completion/completions/", "644"],
    ["target/release/_wonok", "/usr/share/zsh/site-functions/", "644"],
    ["target/release/wonok.fish", "/usr/share/fish/vendor_completions.d/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/wonok.1", dest = "/usr/share/man/man1/", mode = "644" },
    { source = "target/release/wonok", dest = "/usr/bin/", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/doc/wonok/", mode = "644" },
    { source = "AUTHORS", dest = "/usr/share/doc/wonok/", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/wonok/", mode = "644" },
    { source = "target/release/wonok.bash", dest = "/usr/share/bash-completion/completions/", mode = "644" },
    { source = "target/release/_wonok", dest = "/usr/share/zsh/site-functions/", mode = "644" },
    { source = "target/release/wonok.fish", dest = "/usr/share/fish/vendor_completions.d/", mode = "644" },
]
